[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcribe"
version = "0.1.0"
description = "An agentic documentation generator that produces grounded, citation-verified docs for a codebase."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Let tests import `reposcribe` from src/ without an install step (handy in Colab too).
pythonpath = ["src"]
testpaths = ["tests"]
